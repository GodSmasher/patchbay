# patchbay web app for selfhost.
#
#   docker compose up --build
#
# Needs .env.local in the repo root with the three keys. Mock mode (no live calls)
# works out of the box without any env; replay streams the recorded Typeform run.

services:
  web:
    build: .
    image: patchbay-web:local
    ports:
      - "3400:3400"
    environment:
      # Explicit so docker compose config shows the full surface — override via .env.local.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_AI_PROJECT: ${NEBIUS_AI_PROJECT:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PATCHBAY_MOCK: ${PATCHBAY_MOCK:-true}
      PATCHBAY_MAX_RUNS_PER_HOUR: ${PATCHBAY_MAX_RUNS_PER_HOUR:-6}
      PATCHBAY_LLM_PROVIDER: ${PATCHBAY_LLM_PROVIDER:-nebius}
      PATCHBAY_LLM_BASE_URL: ${PATCHBAY_LLM_BASE_URL:-}
      PATCHBAY_LLM_API_KEY: ${PATCHBAY_LLM_API_KEY:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
