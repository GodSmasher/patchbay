name: weekly-rescan

on:
  schedule:
    # Sunday 04:00 UTC — runs after Sunday's daily sweep (03:00 UTC)
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rescan-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Generate weekly rescan report
        run: npx tsx scripts/generate-weekly-rescan.ts

      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/rescan-reports/
          if git diff --cached --quiet; then
            echo "No new weekly report to commit"
          else
            git commit -m "chore(bench): weekly rescan report"
            git push
          fi
