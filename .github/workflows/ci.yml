name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build audit-core (agent depends on its types)
        run: npm run build -w @patchbay-nebius/audit-core

      - name: Build @patchbay-nebius/agent so dependents can resolve its types
        run: npm run build -w @patchbay-nebius/agent

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Unit tests (replay mode, no live keys needed)
        run: npm test
        env:
          PATCHBAY_MOCK: 'true'

      - name: Smoke-test the MCP server over stdio
        run: npx tsx scripts/smoke-mcp.ts
        env:
          PATCHBAY_MOCK: 'true'

      - name: SECRET-001 validation gate (positive + negative corpus)
        run: npm run validate:secret-001

      - name: Finding Schema v2 gate (every check has 5 required fields)
        run: npm run validate:finding-schema

      - name: PROCESS-001 gate (no exec/execSync template-literal with ${} — SEC-001 regression guard)
        run: npm run validate:process-001
