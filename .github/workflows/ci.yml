name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Unit tests (replay mode, no live keys needed)
        run: npm test
        env:
          PATCHBAY_MOCK: 'true'

      - name: Smoke-test the MCP server over stdio
        run: npx tsx scripts/smoke-mcp.ts
        env:
          PATCHBAY_MOCK: 'true'
