name: validate-methodology

# Gate: when a PR touches a check in packages/audit-core/src/checks/*.ts or the
# generator, confirm every non-helper check still carries a valid METADATA
# export AND that apps/web/app/methodology/page.tsx's generated matrix matches
# what the generator would produce. This keeps /methodology honest as checks
# are added, renamed, retired, or have their severity rationale revised.

on:
  pull_request:
    paths:
      - 'packages/audit-core/src/checks/**.ts'
      - 'apps/web/app/methodology/page.tsx'
      - 'scripts/generate-methodology-matrix.mjs'
      - '.github/workflows/validate-methodology.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate check METADATA + matrix freshness
        run: node scripts/generate-methodology-matrix.mjs check
